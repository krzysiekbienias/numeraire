[project]
name = "numeraire-web"
version = "0.5.3"
description = "Django review frontend over the Numeraire++ SQLite database"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-filter>=25.1",
    "gunicorn>=26.0.0",
]

# Not a distributable package: this is a Django project that gets run, not imported.
# Charts are rendered in the browser, so matplotlib / pandas / numpy stay in viz/.
[tool.uv]
package = false
